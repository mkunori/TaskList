# PostgreSQL接続設定
spring.datasource.url=${TASKLIST_DB_URL}
spring.datasource.username=${TASKLIST_DB_USER}
spring.datasource.password=${TASKLIST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf設定
spring.thymeleaf.cache=true

# H2 Consoleは本番では使わない
spring.h2.console.enabled=false

# エラー画面に詳細を出しすぎない
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false

# ポート番号はVPS上のenvファイルでTASKLIST_PORT=で指定する
server.port=${TASKLIST_PORT:8080}