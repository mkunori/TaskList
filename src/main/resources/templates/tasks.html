<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
    <meta charset="UTF-8">
    <title>TaskList</title>

    <!-- Spring Bootの静的ファイルとしてCSSを読み込みます。 -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <h1>TaskList</h1>

    <section class="panel app-description">
        <h2>このアプリについて</h2>

        <p>
            TaskListは、タスクの追加・編集・削除・完了切り替えができるシンプルなタスク管理アプリです。
            期限日、優先度、キーワード検索、絞り込み、並び替えにも対応しています。
        </p>

        <p class="note">
            ログイン機能はありません。タスクはCookieを使ってブラウザ単位で保持されます。
            Cookieを削除した場合や、別のブラウザ・別のPCからアクセスした場合は別のタスクリストになります。
        </p>
    </section>

    <div class="top-panels">
        <section class="panel">
            <h2>新しいタスクを追加</h2>

            <!--
                タスク追加フォームです。
                th:object="${taskForm}" は、Controllerから渡されたTaskFormと対応します。
            -->
            <form class="form-grid" th:action="@{/tasklist/tasks}" th:object="${taskForm}" method="post">
                <div class="form-field">
                    <label for="title">タイトル</label>
                    <input type="text" id="title" th:field="*{title}">
                </div>

                <p class="error-message" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                </p>

                <div class="form-field">
                    <label for="dueDate">期限</label>
                    <input type="date" id="dueDate" th:field="*{dueDate}">
                </div>

                <div class="form-field">
                    <label for="priority">優先度</label>

                    <select id="priority" th:field="*{priority}">
                        <option th:each="priority : ${priorities}" th:value="${priority}"
                            th:text="${priority.displayName}">
                        </option>
                    </select>
                </div>

                <!--
                    現在の表示条件を保持します。
                    追加後も同じ絞り込み・並び替え・検索条件の一覧へ戻るために使います。
                -->
                <input type="hidden" name="filter" th:value="${selectedFilter}">
                <input type="hidden" name="sort" th:value="${selectedSort}">
                <input type="hidden" name="keyword" th:value="${keyword}">

                <div class="form-actions">
                    <button class="primary-button" type="submit">追加</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <h2>表示条件</h2>

            <!--
                表示条件、並び替え条件、検索キーワードを指定するフォームです。
                remember-scroll-form により、条件変更後もスクロール位置を復元します。
            -->
            <form class="form-grid remember-scroll-form" th:action="@{/tasklist}" method="get">
                <div class="form-field">
                    <label for="filter">表示</label>

                    <select id="filter" name="filter">
                        <option th:each="filterType : ${filterTypes}" th:value="${filterType}"
                            th:text="${filterType.displayName}" th:selected="${filterType == selectedFilter}">
                        </option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="sort">並び替え</label>

                    <select id="sort" name="sort">
                        <option th:each="sortType : ${sortTypes}" th:value="${sortType}"
                            th:text="${sortType.displayName}" th:selected="${sortType == selectedSort}">
                        </option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="keyword">検索</label>

                    <input type="text" id="keyword" name="keyword" th:value="${keyword}" placeholder="タイトルで検索">
                </div>

                <div class="form-actions">
                    <button class="primary-button" type="submit">変更</button>

                    <a class="button-link remember-scroll-link" th:href="@{/tasklist}">
                        リセット
                    </a>
                </div>
            </form>
        </section>
    </div>

    <section>
        <h2>タスク一覧</h2>

        <!-- Controllerから渡された tasks をカード形式で1件ずつ表示します。 -->
        <div class="task-list">
            <article class="task-card" th:id="'task-' + ${task.id}" th:each="task : ${tasks}"
                th:classappend="${task.done} ? 'task-card-done' : ''">

                <div class="task-card-header">
                    <h3 class="task-title" th:text="${task.title}">
                        タスクタイトル
                    </h3>

                    <span class="priority-badge" th:text="${task.priority.displayName}">
                        中
                    </span>
                </div>

                <p class="task-due-date" th:classappend="${task.dueDateClass}" th:text="${task.dueDateLabel}">
                    期限なし
                </p>

                <div class="task-actions">
                    <!--
                        完了状態を切り替えるフォームです。
                        現在の表示条件をhiddenで送ることで、操作後も同じ条件の一覧へ戻ります。
                    -->
                    <form class="inline-form remember-scroll-form"
                        th:action="@{/tasklist/tasks/{id}/toggle(id=${task.id})}" method="post">
                        <input type="hidden" name="filter" th:value="${selectedFilter}">
                        <input type="hidden" name="sort" th:value="${selectedSort}">
                        <input type="hidden" name="keyword" th:value="${keyword}">

                        <button type="submit" th:text="${task.done} ? '未完了に戻す' : '完了'">
                            完了
                        </button>
                    </form>

                    <!--
                        編集画面へのリンクです。
                        現在の表示条件をクエリパラメータとして渡します。
                    -->
                    <a class="button-link" th:href="@{/tasklist/tasks/{id}/edit(
                           id=${task.id},
                           filter=${selectedFilter},
                           sort=${selectedSort},
                           keyword=${keyword}
                       )}">
                        編集
                    </a>

                    <!--
                        タスクを削除するフォームです。
                        現在の表示条件をhiddenで送ることで、削除後も同じ条件の一覧へ戻ります。
                    -->
                    <form class="inline-form remember-scroll-form"
                        th:action="@{/tasklist/tasks/{id}/delete(id=${task.id})}" method="post">
                        <input type="hidden" name="filter" th:value="${selectedFilter}">
                        <input type="hidden" name="sort" th:value="${selectedSort}">
                        <input type="hidden" name="keyword" th:value="${keyword}">

                        <button type="submit">削除</button>
                    </form>
                </div>
            </article>
        </div>
    </section>

    <script>
        /*
         * 一覧操作後にスクロール位置を復元します。
         *
         * 完了切り替え、削除、表示条件変更、リセットなどではページ全体が再表示されます。
         * そのままだと画面上部に戻ってしまうため、操作前のスクロール位置を
         * sessionStorageに保存し、再表示後に同じ位置へ戻します。
         */
        document.addEventListener("DOMContentLoaded", function () {
            const scrollY = sessionStorage.getItem("tasklistScrollY");

            if (scrollY !== null) {
                window.scrollTo(0, Number(scrollY));
                sessionStorage.removeItem("tasklistScrollY");
            }

            document.querySelectorAll(".remember-scroll-form").forEach(function (form) {
                form.addEventListener("submit", function () {
                    saveScrollPosition();
                });
            });

            document.querySelectorAll(".remember-scroll-link").forEach(function (link) {
                link.addEventListener("click", function () {
                    saveScrollPosition();
                });
            });
        });

        /*
         * 現在のスクロール位置をsessionStorageに保存します。
         */
        function saveScrollPosition() {
            sessionStorage.setItem("tasklistScrollY", window.scrollY);
        }
    </script>
</body>

</html>
