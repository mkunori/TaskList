<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
    <meta charset="UTF-8">
    <title>TaskList</title>

    <!--
        static/css/style.css を読み込みます。
        th:href="@{/css/style.css}" は、Spring Bootの静的ファイルへのパスに対応します。
    -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <h1>TaskList</h1>

    <section class="panel app-description">
        <h2>このアプリについて</h2>

        <p>
            TaskListは、タスクの追加・編集・削除・完了切り替えができるシンプルなタスク管理アプリです。
            期限日、優先度、キーワード検索、絞り込み、並び替えにも対応しています。
        </p>

        <p class="note">
            ログイン機能はありません。タスクはCookieを使ってブラウザ単位で保持されます。
            Cookieを削除した場合や、別のブラウザからアクセスした場合は別のタスクリストになります。
        </p>
    </section>

    <div class="top-panels">
        <section class="panel">
            <h2>新しいタスクを追加</h2>

            <!--
                タスク追加フォームです。
                th:object="${taskForm}" は、Controllerから渡されたTaskFormと対応します。
            -->
            <form class="form-grid" th:action="@{/tasklist/tasks}" th:object="${taskForm}" method="post">
                <div class="form-field">
                    <label for="title">タイトル</label>

                    <!--
                        th:field="*{title}" は taskForm.title と対応します。
                        入力された文字列は、ControllerのTaskFormに入ります。
                    -->
                    <input type="text" id="title" th:field="*{title}">
                </div>

                <!--
                    titleに入力エラーがある場合だけ、エラーメッセージを表示します。
                -->
                <p class="error-message"
                th:if="${#fields.hasErrors('title')}"
                th:errors="*{title}">
                </p>

                <div class="form-field">
                    <label for="dueDate">期限</label>

                    <!--
                        type="date" にすると、ブラウザの日付入力欄になります。
                        th:field="*{dueDate}" は taskForm.dueDate と対応します。
                        未入力の場合、Java側では null として扱われます。
                    -->
                    <input type="date" id="dueDate" th:field="*{dueDate}">
                </div>

                <div class="form-field">
                    <label for="priority">優先度</label>
                
                    <!--
                        th:field="*{priority}" は taskForm.priority と対応します。
                        priorities は Controller の @ModelAttribute から渡されています。
                    -->
                    <select id="priority" th:field="*{priority}">
                        <option th:each="priority : ${priorities}"
                                th:value="${priority}"
                                th:text="${priority.displayName}">
                        </option>
                    </select>
                </div>
                
                <!--
                    現在の表示条件を保持するための隠し項目です。
                    タスク追加後も、同じ絞り込み・並び替え・検索条件の一覧へ戻るために使います。
                -->
                <input type="hidden" name="filter" th:value="${selectedFilter}">
                <input type="hidden" name="sort" th:value="${selectedSort}">
                <input type="hidden" name="keyword" th:value="${keyword}">

                <button class="primary-button" type="submit">追加</button>
            </form>
        </section>

        <section class="panel">
            <h2>表示条件</h2>
        
            <!--
                タスク一覧の表示条件、並び替え条件、検索キーワードを指定するフォームです。
                method="get" にすることで、選択した条件がURLのクエリパラメータとして送信されます。
                例: /tasklist?filter=ACTIVE&sort=DUE_DATE&keyword=Spring
            -->
            <form class="form-grid" th:action="@{/tasklist}" method="get">
                <div class="form-field">
                    <label for="filter">表示</label>
        
                    <!--
                        name="filter" は Controller の @RequestParam(name = "filter") と対応します。
                        selectedFilter は、現在選択中の表示条件です。
                    -->
                    <select id="filter" name="filter">
                        <option th:each="filterType : ${filterTypes}"
                                th:value="${filterType}"
                                th:text="${filterType.displayName}"
                                th:selected="${filterType == selectedFilter}">
                        </option>
                    </select>
                </div>
        
                <div class="form-field">
                    <label for="sort">並び替え</label>
        
                    <!--
                        name="sort" は Controller の @RequestParam(name = "sort") と対応します。
                        selectedSort は、現在選択中の並び替え条件です。
                    -->
                    <select id="sort" name="sort">
                        <option th:each="sortType : ${sortTypes}"
                                th:value="${sortType}"
                                th:text="${sortType.displayName}"
                                th:selected="${sortType == selectedSort}">
                        </option>
                    </select>
                </div>
        
                <div class="form-field">
                    <label for="keyword">検索</label>
        
                    <!--
                        name="keyword" は Controller の @RequestParam(name = "keyword") と対応します。
                        valueには現在の検索キーワードを入れて、検索後も入力欄に文字が残るようにします。
                    -->
                    <input type="text"
                        id="keyword"
                        name="keyword"
                        th:value="${keyword}"
                        placeholder="タイトルで検索">
                </div>
        
                <div class="form-actions">
                    <button class="primary-button" type="submit">変更</button>
                    <a class="button-link" th:href="@{/tasklist}">リセット</a>
                </div>
            </form>
        </section>
    </div>

    <section>
        <h2>タスク一覧</h2>

        <!--
            Controllerから渡された tasks をカード形式で1件ずつ表示します。
        -->
        <div class="task-list">
            <article class="task-card"
                    th:each="task : ${tasks}"
                    th:classappend="${task.done} ? ' task-card-done' : ''">

                <div class="task-card-header">
                    <h3 class="task-title"
                        th:text="${task.title}">
                        タスクタイトル
                    </h3>

                    <span class="priority-badge"
                        th:text="${task.priority.displayName}">
                        中
                    </span>
                </div>

                <p class="task-due-date"
                th:classappend="${task.dueDateClass}"
                th:text="${task.dueDateLabel}">
                    期限なし
                </p>

                <div class="task-actions">
                    <!--
                        完了状態を切り替えるフォームです。
                        現在の表示条件をhiddenで送ることで、操作後も同じ条件の一覧へ戻ります。
                    -->
                    <form class="inline-form remember-scroll-form"
                          th:action="@{/tasklist/tasks/{id}/toggle(id=${task.id})}"
                          method="post">
                        <input type="hidden" name="filter" th:value="${selectedFilter}">
                        <input type="hidden" name="sort" th:value="${selectedSort}">
                        <input type="hidden" name="keyword" th:value="${keyword}">

                        <button type="submit"
                                th:text="${task.done} ? '未完了に戻す' : '完了'">
                            完了
                        </button>
                    </form>

                    <!--
                        編集画面へのリンクです。
                        現在の表示条件をクエリパラメータとして渡します。
                    -->
                    <a class="button-link"
                    th:href="@{/tasklist/tasks/{id}/edit(
                        id=${task.id},
                        filter=${selectedFilter},
                        sort=${selectedSort},
                        keyword=${keyword}
                    )}">
                        編集
                    </a>

                    <!--
                        タスクを削除するフォームです。
                        現在の表示条件をhiddenで送ることで、削除後も同じ条件の一覧へ戻ります。
                    -->
                    <form class="inline-form"
                        th:action="@{/tasklist/tasks/{id}/delete(id=${task.id})}"
                        method="post">
                        <input type="hidden" name="filter" th:value="${selectedFilter}">
                        <input type="hidden" name="sort" th:value="${selectedSort}">
                        <input type="hidden" name="keyword" th:value="${keyword}">

                        <button type="submit">削除</button>
                    </form>
                </div>
            </article>
        </div>
    </section>

<script>
    /*
     * 完了切り替え後に、画面のスクロール位置を復元します。
     *
     * 完了ボタンを押すと、フォーム送信によりページ全体が再表示されます。
     * そのままだと画面上部に戻ってしまうため、送信前のスクロール位置を
     * sessionStorageに保存し、再表示後に同じ位置へ戻します。
     */
    document.addEventListener("DOMContentLoaded", function () {
        const scrollY = sessionStorage.getItem("tasklistScrollY");

        if (scrollY !== null) {
            window.scrollTo(0, Number(scrollY));
            sessionStorage.removeItem("tasklistScrollY");
        }

        document.querySelectorAll(".remember-scroll-form").forEach(function (form) {
            form.addEventListener("submit", function () {
                sessionStorage.setItem("tasklistScrollY", window.scrollY);
            });
        });
    });
</script>

</body>

</html>
